[project]
name = "flive"
version = "0.1.0"
description = "Live football match analysis and fantasy tracking"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "httpx>=0.27",
    "streamlit>=1.37",
    "pyarrow>=16.0",
    "altair>=5.3",
]

[project.scripts]
flive-ingest = "flive.ingest:main"
flive-compact = "flive.store:compact_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flive"]
